<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автоматическая публикация работает</title>
<style>
  :root {
    --bg1: #0f172a; --bg2: #1e1b4b; --card: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.12); --text: #f8fafc; --muted: #cbd5e1;
    --ok: #22c55e; --a1: #818cf8; --a2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    overflow-x: hidden;
  }
  .glow { position: fixed; width: 480px; height: 480px; border-radius: 50%; filter: blur(120px); opacity: .35; z-index: 0; }
  .g1 { background: var(--a1); top: -160px; left: -120px; }
  .g2 { background: var(--a2); bottom: -180px; right: -140px; }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 640px; text-align: center;
    padding: 48px 32px; border-radius: 24px; background: var(--card);
    border: 1px solid var(--border); backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: rise .7s ease-out both;
  }
  .badge {
    width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(34,197,94,.15);
    box-shadow: 0 0 0 0 rgba(34,197,94,.5); animation: pulse 2.4s infinite;
  }
  .badge svg { width: 44px; height: 44px; stroke: var(--ok); }
  .badge path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .8s .4s ease-out forwards; }
  h1 {
    font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.15; font-weight: 800;
    background: linear-gradient(90deg, #fff, var(--a2) 60%, var(--a1));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin-top: 16px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  .chain { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .chain span { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.04); font-size: .9rem; }
  .chain i { color: var(--muted); font-style: normal; }
  footer { margin-top: 28px; font-size: .85rem; color: var(--muted); opacity: .75; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.45); } 70% { box-shadow: 0 0 0 22px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .badge path { stroke-dashoffset: 0; } }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>Автоматическая публикация работает</h1>
    <p>Эта страница собрана, проверена и опубликована автоматически — без ручных шагов.</p>
    <div class="chain"><span>Claude Code</span><i>→</i><span>GitHub</span><i>→</i><span>Vercel</span></div>
    <footer>Тестовый проект vercel-deploy-test</footer>
  </main>
</body>
</html>
